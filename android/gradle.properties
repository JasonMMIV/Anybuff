# AnyBuff Android — Gradle project (Phase B, M-B0+)
# Independent Gradle project — NOT part of the bun workspace (plan §4).

# ── Version facts (pinned 2026-09-03 from local caches + official docs) ──
# AGP 8.13.2   min Gradle 8.13 (we use 8.14)   JDK ≥17 (works on 24 via Gradle 8.14)
# Gradle 8.14  first Gradle supporting running on JDK 24
# Kotlin 2.3.20 supports Gradle ≤9.x and AGP ≤8.13.x
# compileSdk 36 max supported by AGP 8.13 (up to 36.1)
AGP_VERSION=8.13.2
KOTLIN_VERSION=2.3.20

# ── SDK / JDK locations ──
# sdk.dir is auto-generated by local.properties from ANDROID_HOME on first sync.
# JDK: AGP 8.x is certified for JDK 17 (not 24). This machine has jdk-17
# under C:\Program Files\Java; point Gradle's daemon at it. On other machines
# delete this line and let Gradle use whatever JDK is configured (≥17).
org.gradle.java.home=C\:/Program Files/Java/jdk-17

# ── Build tuning ──
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AndroidX versions (use versions present in the local Gradle cache to allow
# offline-first builds; bump deliberately when the network build is set up).
ANDROIDX_WEBKIT=1.14.0
ANDROIDX_ACTIVITY=1.11.0
ANDROIDX_CORE=1.17.0
ANDROIDX_LIFECYCLE=2.7.0
ANDROIDX_DOCUMENTFILE=1.0.0
