# AnyBuff Windows 桌面端自動發佈
#
# 本機零憑證發佈：只要 push 一個 v* tag（例：v0.1.0-beta.3），
# workflow 即用 repo 內建 GITHUB_TOKEN 建立 GitHub Release，並上傳
# electron-builder 產出的 exe + .blockmap + latest.yml 三個檔案
# （electron-updater 偵測更新需要三個缺一不可，見 ADR-14）。
#
# 觸發方式：
#   git tag v0.1.0-beta.3
#   git push origin v0.1.0-beta.3
#
# 若使用者偏好手動上傳 exe（檔案較大），可在 workflow 上傳後再自行
# 以瀏覽器對該 Release 附加 AnyBuff-Setup-<version>.exe；blockmap 與
# latest.yml 已由此 workflow 上傳，exe 補上後即可被自動更新偵測。

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch ripgrep + build SDK
        # desktop 的 pre-dist.mjs 需要 sdk/dist/vendor/ripgrep/x64-win32/rg.exe
        run: |
          cd sdk
          bun run fetch-ripgrep
          bun run build

      - name: Package desktop (electron-builder NSIS)
        # dist script = pre-dist + electron-vite build + electron-builder --win + smoke
        run: |
          cd desktop
          bun run dist

      - name: Create Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## AnyBuff ${{ github.ref_name }}

            Windows 桌面端安裝包（NSIS，x64，per-user 免 UAC）。

            > 注意：SmartScreen 會提示「不明發行者」——未簽章開源自簽安裝包為預期行為，點「其他資訊 → 仍要執行」即可。

            自動更新：exe + `.blockmap` + `latest.yml` 三個檔案缺一不可；若 exe 尚未上傳（檔案較大由維護者手動補傳），請補上後自動更新才會被偵測。
          draft: true
          files: |
            desktop/release-build/*.exe
            desktop/release-build/*.exe.blockmap
            desktop/release-build/latest.yml
